<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Classic Snake</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh; height: 100dvh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      overflow: hidden;
      touch-action: none;
      user-select: none; -webkit-user-select: none;
    }
    h1 {
      font-size: 1.25rem; font-weight: 600; letter-spacing: 0.04em;
      margin-bottom: 8px; color: #94a3b8;
    }
    #game-container {
      position: relative;
      border-radius: 12px; overflow: hidden;
      box-shadow: 0 0 0 2px #1e293b, 0 16px 32px rgba(0,0,0,0.45);
      touch-action: none;
    }
    canvas { display: block; background: #020617; touch-action: none; }
    #ui {
      margin-top: 10px; display: flex; gap: 12px; font-size: 0.88rem;
      color: #94a3b8; flex-wrap: wrap; justify-content: center; align-items: center;
    }
    #score, #highscore, #speed { font-variant-numeric: tabular-nums; }
    #status { min-width: 110px; text-align: center; font-size: 0.82rem; }
    .btn {
      background: #1e293b; color: #e2e8f0; border: 1px solid #334155;
      border-radius: 6px; padding: 6px 12px; font-size: 0.82rem; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { background: #334155; }
    .skins {
      margin-top: 12px; display: flex; gap: 7px; align-items: center;
    }
    .skins span { font-size: 0.78rem; color: #64748b; margin-right: 2px; }
    .skin-btn {
      width: 24px; height: 24px; border-radius: 5px;
      border: 2px solid transparent; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .skin-btn.active { border-color: #e2e8f0; }
    .hint {
      margin-top: 10px; font-size: 0.76rem; color: #475569;
      text-align: center; max-width: 280px; line-height: 1.3;
    }
    /* Joystick */
    #joystick-zone {
      position: fixed;
      left: 18px; bottom: 28px;
      width: 110px; height: 110px;
      z-index: 20;
      touch-action: none;
    }
    #joystick-base {
      width: 110px; height: 110px; border-radius: 50%;
      background: rgba(30, 41, 59, 0.65);
      border: 2px solid rgba(148, 163, 184, 0.35);
      position: relative;
    }
    #joystick-knob {
      width: 48px; height: 48px; border-radius: 50%;
      background: rgba(148, 163, 184, 0.85);
      position: absolute; left: 31px; top: 31px;
      transition: background 0.1s;
      pointer-events: none;
    }
    #joystick-knob.active {
      background: rgba(74, 222, 128, 0.9);
    }
  </style>
</head>
<body>
  <h1>Classic Snake</h1>

  <div id="game-container">
    <canvas id="game" width="360" height="360"></canvas>
  </div>

  <div id="ui">
    <div>Score: <span id="score">0</span></div>
    <div>Best: <span id="highscore">0</span></div>
    <div>Speed: <span id="speed">1.0x</span></div>
    <div id="status">Use joystick or swipe</div>
  </div>

  <div style="margin-top: 9px; display: flex; gap: 9px;">
    <button class="btn" id="pauseBtn">Pause</button>
    <button class="btn" id="resetBtn">Reset</button>
  </div>

  <div class="skins">
    <span>Skin:</span>
    <button class="skin-btn active" data-skin="0" style="background: linear-gradient(135deg, #4ade80, #16a34a)"></button>
    <button class="skin-btn" data-skin="1" style="background: linear-gradient(135deg, #38bdf8, #0284c7)"></button>
    <button class="skin-btn" data-skin="2" style="background: linear-gradient(135deg, #c084fc, #7c3aed)"></button>
    <button class="skin-btn" data-skin="3" style="background: linear-gradient(135deg, #fb923c, #ea580c)"></button>
    <button class="skin-btn" data-skin="4" style="background: linear-gradient(135deg, #f472b6, #db2777)"></button>
  </div>

  <div class="hint">Joystick (bottom left) or swipe on the board</div>

  <!-- Virtual Joystick -->
  <div id="joystick-zone">
    <div id="joystick-base">
      <div id="joystick-knob"></div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highscoreEl = document.getElementById('highscore');
    const speedEl = document.getElementById('speed');
    const statusEl = document.getElementById('status');
    const pauseBtn = document.getElementById('pauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const knob = document.getElementById('joystick-knob');
    const joyZone = document.getElementById('joystick-zone');

    // Audio
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, dur, type='square', vol=0.11) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur);
    }
    function playEatSound() {
      playBeep(660, 0.07); setTimeout(() => playBeep(880, 0.055), 45);
    }
    function playGameOverSound() {
      playBeep(210, 0.14, 'sawtooth', 0.09);
      setTimeout(() => playBeep(150, 0.22, 'sawtooth', 0.07), 110);
    }

    // Particles
    let particles = [];
    function spawnParticles(x, y) {
      for (let i = 0; i < 8; i++) {
        particles.push({
          x: x * CELL + CELL/2, y: y * CELL + CELL/2,
          vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4,
          life: 1, size: Math.random()*2.6 + 1.3
        });
      }
    }
    function updateParticles() {
      for (let i = particles.length-1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life -= 0.04; p.vy += 0.06;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }
    function drawParticles() {
      particles.forEach(p => {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = '#f43f5e';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    // Game constants
    const GRID = 18;
    const CELL = canvas.width / GRID;
    const BASE_SPEED = 145;
    const MIN_SPEED = 70;
    const SPEED_STEP = 3.2;

    // Skins: [head, body, pattern style]
    // pattern: 0=flat, 1=stripes, 2=scales, 3=dots, 4=gradient edge
    const skins = [
      { head: '#4ade80', body: '#22c55e', pattern: 1 }, // green stripes
      { head: '#38bdf8', body: '#0ea5e9', pattern: 2 }, // blue scales
      { head: '#c084fc', body: '#a855f7', pattern: 3 }, // purple dots
      { head: '#fb923c', body: '#f97316', pattern: 1 }, // orange stripes
      { head: '#f472b6', body: '#ec4899', pattern: 4 }  // pink edge
    ];

    let currentSkin = 0;
    let snake = [{x:9, y:9}];
    let direction = {x:0, y:0};
    let nextDirection = {x:0, y:0};
    let food = null;
    let score = 0;
    let highScore = parseInt(localStorage.getItem('snakeHighScore') || '0');
    let gameLoop = null;
    let gameOver = false;
    let started = false;
    let paused = false;

    highscoreEl.textContent = highScore;

    function getCurrentSpeed() {
      return Math.max(MIN_SPEED, BASE_SPEED - (snake.length-1) * SPEED_STEP);
    }
    function updateSpeedDisplay() {
      speedEl.textContent = (BASE_SPEED / getCurrentSpeed()).toFixed(1) + 'x';
    }

    function placeFood() {
      while (true) {
        const x = Math.floor(Math.random()*GRID);
        const y = Math.floor(Math.random()*GRID);
        if (!snake.some(s => s.x===x && s.y===y)) { food = {x,y}; break; }
      }
    }

    // Draw patterned body segment
    function drawSegment(x, y, isHead, dir) {
      const skin = skins[currentSkin];
      const px = x * CELL;
      const py = y * CELL;

      // Base
      ctx.fillStyle = isHead ? skin.head : skin.body;
      ctx.beginPath();
      ctx.roundRect(px+1, py+1, CELL-2, CELL-2, isHead ? 6 : 5);
      ctx.fill();

      if (isHead) {
        // Eyes
        ctx.fillStyle = '#0f172a';
        const es = 2.7, off = 4.8;
        let e1, e2;
        if (dir.x === -1) {
          e1 = {x: px+off, y: py+off}; e2 = {x: px+off, y: py+CELL-off-es};
        } else if (dir.y === -1) {
          e1 = {x: px+off, y: py+off}; e2 = {x: px+CELL-off-es, y: py+off};
        } else if (dir.y === 1) {
          e1 = {x: px+off, y: py+CELL-off-es}; e2 = {x: px+CELL-off-es, y: py+CELL-off-es};
        } else {
          e1 = {x: px+CELL-off-1, y: py+off}; e2 = {x: px+CELL-off-1, y: py+CELL-off-es};
        }
        ctx.beginPath();
        ctx.arc(e1.x+es/2, e1.y+es/2, es/2, 0, Math.PI*2);
        ctx.arc(e2.x+es/2, e2.y+es/2, es/2, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(e1.x+es/2+0.5, e1.y+es/2-0.4, 0.75, 0, Math.PI*2);
        ctx.arc(e2.x+es/2+0.5, e2.y+es/2-0.4, 0.75, 0, Math.PI*2);
        ctx.fill();
        return;
      }

      // Body patterns
      ctx.save();
      ctx.beginPath();
      ctx.roundRect(px+1, py+1, CELL-2, CELL-2, 5);
      ctx.clip();

      if (skin.pattern === 1) { // stripes
        ctx.fillStyle = 'rgba(0,0,0,0.18)';
        for (let i = 0; i < 3; i++) {
          ctx.fillRect(px + 3 + i*5, py+2, 2.2, CELL-4);
        }
      } else if (skin.pattern === 2) { // scales
        ctx.fillStyle = 'rgba(255,255,255,0.13)';
        ctx.beginPath();
        ctx.arc(px + CELL*0.35, py + CELL*0.4, 3.2, 0, Math.PI*2);
        ctx.arc(px + CELL*0.65, py + CELL*0.65, 2.8, 0, Math.PI*2);
        ctx.fill();
      } else if (skin.pattern === 3) { // dots
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath();
        ctx.arc(px + CELL*0.35, py + CELL*0.35, 1.6, 0, Math.PI*2);
        ctx.arc(px + CELL*0.65, py + CELL*0.65, 1.6, 0, Math.PI*2);
        ctx.fill();
      } else if (skin.pattern === 4) { // edge highlight
        ctx.strokeStyle = 'rgba(255,255,255,0.22)';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(px+3, py+3, CELL-6, CELL-6);
      }
      ctx.restore();
    }

    function draw() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1;
      for (let i = 0; i <= GRID; i++) {
        ctx.beginPath(); ctx.moveTo(i*CELL, 0); ctx.lineTo(i*CELL, canvas.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i*CELL); ctx.lineTo(canvas.width, i*CELL); ctx.stroke();
      }

      // Food
      if (food) {
        ctx.fillStyle = '#f43f5e';
        ctx.beginPath();
        ctx.roundRect(food.x*CELL+2, food.y*CELL+2, CELL-4, CELL-4, 4);
        ctx.fill();
      }

      // Body (back to front)
      for (let i = snake.length-1; i >= 1; i--) {
        drawSegment(snake[i].x, snake[i].y, false, direction);
      }
      // Head
      if (snake.length) drawSegment(snake[0].x, snake[0].y, true, direction);

      drawParticles();
    }

    function update() {
      if (gameOver || !started || paused) return;

      direction = {...nextDirection};
      if (direction.x === 0 && direction.y === 0) return;

      const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

      if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
        endGame(); return;
      }
      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        endGame(); return;
      }

      snake.unshift(head);

      if (food && head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        playEatSound();
        spawnParticles(food.x, food.y);
        if (score > highScore) {
          highScore = score;
          highscoreEl.textContent = highScore;
          localStorage.setItem('snakeHighScore', highScore);
        }
        placeFood();
        clearInterval(gameLoop);
        gameLoop = setInterval(update, getCurrentSpeed());
        updateSpeedDisplay();
      } else {
        snake.pop();
      }

      updateParticles();
      draw();
    }

    function endGame() {
      gameOver = true;
      statusEl.textContent = 'Game Over';
      playGameOverSound();
      clearInterval(gameLoop);
    }

    function reset() {
      snake = [{x:9,y:9}];
      direction = {x:0,y:0};
      nextDirection = {x:0,y:0};
      score = 0; scoreEl.textContent = '0';
      gameOver = false; started = false; paused = false;
      particles = [];
      pauseBtn.textContent = 'Pause';
      statusEl.textContent = 'Use joystick or swipe';
      placeFood(); updateSpeedDisplay(); draw();
      clearInterval(gameLoop);
      // reset knob
      knob.style.transform = 'translate(0,0)';
      knob.classList.remove('active');
    }

    function startLoop() {
      clearInterval(gameLoop);
      gameLoop = setInterval(update, getCurrentSpeed());
      updateSpeedDisplay();
    }

    function togglePause() {
      if (!started || gameOver) return;
      paused = !paused;
      if (paused) {
        statusEl.textContent = 'Paused';
        pauseBtn.textContent = 'Resume';
        clearInterval(gameLoop);
      } else {
        statusEl.textContent = 'Playing';
        pauseBtn.textContent = 'Pause';
        startLoop();
      }
    }

    function setDirection(newDir) {
      if (direction.x + newDir.x === 0 && direction.y + newDir.y === 0) return;
      nextDirection = newDir;
      if (!started) {
        started = true;
        statusEl.textContent = 'Playing';
        if (audioCtx.state === 'suspended') audioCtx.resume();
        startLoop();
      }
    }

    // Buttons
    pauseBtn.addEventListener('click', togglePause);
    resetBtn.addEventListener('click', reset);

    // Skins
    document.querySelectorAll('.skin-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.skin-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentSkin = parseInt(btn.dataset.skin);
        draw();
      });
    });

    // Keyboard
    window.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      if (k === 'r') { reset(); return; }
      if (k === 'p' || k === ' ') { e.preventDefault(); togglePause(); return; }
      let d = null;
      if (k === 'arrowup' || k === 'w') d = {x:0,y:-1};
      if (k === 'arrowdown' || k === 's') d = {x:0,y:1};
      if (k === 'arrowleft' || k === 'a') d = {x:-1,y:0};
      if (k === 'arrowright' || k === 'd') d = {x:1,y:0};
      if (d) setDirection(d);
    });

    // ========== VIRTUAL JOYSTICK (smoothed) ==========
    let joyActive = false;
    let joyId = null;
    const maxDist = 32; // max knob travel

    function joyStart(e) {
      e.preventDefault();
      const t = e.changedTouches ? e.changedTouches[0] : e;
      joyActive = true;
      joyId = t.identifier ?? 'mouse';
      knob.classList.add('active');
      if (audioCtx.state === 'suspended') audioCtx.resume();
      joyMove(e);
    }

    function joyMove(e) {
      if (!joyActive) return;
      e.preventDefault();

      let t = null;
      if (e.changedTouches) {
        for (let touch of e.changedTouches) {
          if (touch.identifier === joyId) { t = touch; break; }
        }
      } else {
        t = e;
      }
      if (!t) return;

      const rect = joyZone.getBoundingClientRect();
      const cx = rect.left + rect.width/2;
      const cy = rect.top + rect.height/2;

      let dx = t.clientX - cx;
      let dy = t.clientY - cy;
      const dist = Math.sqrt(dx*dx + dy*dy);

      // Clamp to max distance (smooth feel)
      if (dist > maxDist) {
        dx = (dx / dist) * maxDist;
        dy = (dy / dist) * maxDist;
      }

      knob.style.transform = `translate(${dx}px, ${dy}px)`;

      // Convert to direction with deadzone
      const dead = 10;
      if (Math.abs(dx) < dead && Math.abs(dy) < dead) return;

      if (Math.abs(dx) > Math.abs(dy)) {
        setDirection(dx > 0 ? {x:1,y:0} : {x:-1,y:0});
      } else {
        setDirection(dy > 0 ? {x:0,y:1} : {x:0,y:-1});
      }
    }

    function joyEnd(e) {
      if (!joyActive) return;
      let match = false;
      if (e.changedTouches) {
        for (let touch of e.changedTouches) {
          if (touch.identifier === joyId) { match = true; break; }
        }
      } else {
        match = true;
      }
      if (!match) return;

      joyActive = false;
      joyId = null;
      knob.style.transform = 'translate(0,0)';
      knob.classList.remove('active');
    }

    // Touch + mouse support for joystick
    joyZone.addEventListener('touchstart', joyStart, {passive:false});
    joyZone.addEventListener('touchmove', joyMove, {passive:false});
    joyZone.addEventListener('touchend', joyEnd, {passive:false});
    joyZone.addEventListener('touchcancel', joyEnd, {passive:false});

    joyZone.addEventListener('mousedown', joyStart);
    window.addEventListener('mousemove', joyMove);
    window.addEventListener('mouseup', joyEnd);

    // Also keep swipe on the canvas as backup
    let swipeX = 0, swipeY = 0, swiped = false;
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      const t = e.touches[0];
      swipeX = t.clientX; swipeY = t.clientY; swiped = false;
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }, {passive:false});

    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      if (swiped || gameOver || paused) return;
      const t = e.touches[0];
      const dx = t.clientX - swipeX;
      const dy = t.clientY - swipeY;
      if (Math.abs(dx) < 22 && Math.abs(dy) < 22) return;
      swiped = true;
      if (Math.abs(dx) > Math.abs(dy)) {
        setDirection(dx > 0 ? {x:1,y:0} : {x:-1,y:0});
      } else {
        setDirection(dy > 0 ? {x:0,y:1} : {x:0,y:-1});
      }
    }, {passive:false});

    canvas.addEventListener('touchend', e => { e.preventDefault(); swiped = false; }, {passive:false});

    // Init
    placeFood();
    updateSpeedDisplay();
    draw();
  </script>
</body>
</html>
