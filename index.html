<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Classic Snake</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: none;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
      color: #94a3b8;
    }

    #game-container {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 0 2px #1e293b, 0 20px 40px rgba(0,0,0,0.4);
    }

    canvas {
      display: block;
      background: #020617;
    }

    #ui {
      margin-top: 14px;
      display: flex;
      gap: 22px;
      font-size: 0.95rem;
      color: #94a3b8;
      flex-wrap: wrap;
      justify-content: center;
    }

    #score, #highscore, #speed {
      font-variant-numeric: tabular-nums;
    }

    #status {
      min-width: 140px;
      text-align: center;
    }

    .skins {
      margin-top: 18px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .skins span {
      font-size: 0.85rem;
      color: #64748b;
      margin-right: 4px;
    }

    .skin-btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }

    .skin-btn:hover {
      transform: scale(1.12);
    }

    .skin-btn.active {
      border-color: #e2e8f0;
      transform: scale(1.12);
    }

    .hint {
      margin-top: 16px;
      font-size: 0.85rem;
      color: #475569;
    }
  </style>
</head>
<body>
  <h1>Classic Snake</h1>

  <div id="game-container">
    <canvas id="game" width="400" height="400"></canvas>
  </div>

  <div id="ui">
    <div>Score: <span id="score">0</span></div>
    <div>Best: <span id="highscore">0</span></div>
    <div>Speed: <span id="speed">1.0x</span></div>
    <div id="status">Press any arrow to start</div>
  </div>

  <div class="skins">
    <span>Skin:</span>
    <button class="skin-btn active" data-skin="0" style="background: linear-gradient(135deg, #4ade80, #16a34a)" title="Classic Green"></button>
    <button class="skin-btn" data-skin="1" style="background: linear-gradient(135deg, #38bdf8, #0284c7)" title="Sky Blue"></button>
    <button class="skin-btn" data-skin="2" style="background: linear-gradient(135deg, #c084fc, #7c3aed)" title="Purple"></button>
    <button class="skin-btn" data-skin="3" style="background: linear-gradient(135deg, #fb923c, #ea580c)" title="Orange"></button>
    <button class="skin-btn" data-skin="4" style="background: linear-gradient(135deg, #f472b6, #db2777)" title="Pink"></button>
  </div>

  <div class="hint">Arrow keys or WASD to move • R to restart</div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highscoreEl = document.getElementById('highscore');
    const speedEl = document.getElementById('speed');
    const statusEl = document.getElementById('status');

    // ========== AUDIO ==========
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playBeep(frequency, duration, type = 'square', volume = 0.12) {
      // Resume audio context if suspended (browsers require user interaction first)
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();

      oscillator.type = type;
      oscillator.frequency.value = frequency;

      gainNode.gain.setValueAtTime(volume, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      oscillator.start();
      oscillator.stop(audioCtx.currentTime + duration);
    }

    function playEatSound() {
      // Short happy blip
      playBeep(660, 0.07, 'square', 0.1);
      setTimeout(() => playBeep(880, 0.06, 'square', 0.08), 50);
    }

    function playGameOverSound() {
      // Lower descending tone
      playBeep(220, 0.15, 'sawtooth', 0.1);
      setTimeout(() => playBeep(160, 0.25, 'sawtooth', 0.08), 120);
    }

    // ========== GAME ==========
    const GRID = 20;
    const CELL = canvas.width / GRID;

    const BASE_SPEED = 140;
    const MIN_SPEED = 65;
    const SPEED_STEP = 3.5;

    const skins = [
      ['#4ade80', '#22c55e'],
      ['#38bdf8', '#0ea5e9'],
      ['#c084fc', '#a855f7'],
      ['#fb923c', '#f97316'],
      ['#f472b6', '#ec4899']
    ];

    let currentSkin = 0;
    let snake = [{ x: 10, y: 10 }];
    let direction = { x: 0, y: 0 };
    let nextDirection = { x: 0, y: 0 };
    let food = null;
    let score = 0;
    let highScore = parseInt(localStorage.getItem('snakeHighScore') || '0');
    let gameLoop = null;
    let gameOver = false;
    let started = false;

    highscoreEl.textContent = highScore;

    function getCurrentSpeed() {
      const speed = BASE_SPEED - (snake.length - 1) * SPEED_STEP;
      return Math.max(MIN_SPEED, speed);
    }

    function updateSpeedDisplay() {
      const current = getCurrentSpeed();
      const multiplier = (BASE_SPEED / current).toFixed(1);
      speedEl.textContent = multiplier + 'x';
    }

    function placeFood() {
      while (true) {
        const x = Math.floor(Math.random() * GRID);
        const y = Math.floor(Math.random() * GRID);
        const onSnake = snake.some(seg => seg.x === x && seg.y === y);
        if (!onSnake) {
          food = { x, y };
          break;
        }
      }
    }

    function draw() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1;
      for (let i = 0; i <= GRID; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL, 0);
        ctx.lineTo(i * CELL, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * CELL);
        ctx.lineTo(canvas.width, i * CELL);
        ctx.stroke();
      }

      // Food
      if (food) {
        ctx.fillStyle = '#f43f5e';
        ctx.beginPath();
        ctx.roundRect(food.x * CELL + 2, food.y * CELL + 2, CELL - 4, CELL - 4, 4);
        ctx.fill();
      }

      // Body
      const [headColor, bodyColor] = skins[currentSkin];
      for (let i = snake.length - 1; i >= 1; i--) {
        const seg = snake[i];
        ctx.fillStyle = bodyColor;
        ctx.beginPath();
        ctx.roundRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2, 5);
        ctx.fill();
      }

      // Head + face
      if (snake.length > 0) {
        const head = snake[0];
        const hx = head.x * CELL;
        const hy = head.y * CELL;

        ctx.fillStyle = headColor;
        ctx.beginPath();
        ctx.roundRect(hx + 1, hy + 1, CELL - 2, CELL - 2, 6);
        ctx.fill();

        // Eyes
        ctx.fillStyle = '#0f172a';
        const eyeSize = 3.2;
        const offset = 5.5;

        let eye1, eye2;

        if (direction.x === -1) { // left
          eye1 = { x: hx + offset, y: hy + offset };
          eye2 = { x: hx + offset, y: hy + CELL - offset - eyeSize };
        } else if (direction.y === -1) { // up
          eye1 = { x: hx + offset, y: hy + offset };
          eye2 = { x: hx + CELL - offset - eyeSize, y: hy + offset };
        } else if (direction.y === 1) { // down
          eye1 = { x: hx + offset, y: hy + CELL - offset - eyeSize };
          eye2 = { x: hx + CELL - offset - eyeSize, y: hy + CELL - offset - eyeSize };
        } else { // right or not moving
          eye1 = { x: hx + CELL - offset - 1, y: hy + offset };
          eye2 = { x: hx + CELL - offset - 1, y: hy + CELL - offset - eyeSize };
        }

        ctx.beginPath();
        ctx.arc(eye1.x + eyeSize/2, eye1.y + eyeSize/2, eyeSize/2, 0, Math.PI * 2);
        ctx.arc(eye2.x + eyeSize/2, eye2.y + eyeSize/2, eyeSize/2, 0, Math.PI * 2);
        ctx.fill();

        // Eye highlights
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(eye1.x + eyeSize/2 + 0.6, eye1.y + eyeSize/2 - 0.5, 0.9, 0, Math.PI * 2);
        ctx.arc(eye2.x + eyeSize/2 + 0.6, eye2.y + eyeSize/2 - 0.5, 0.9, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function update() {
      if (gameOver || !started) return;

      direction = { ...nextDirection };

      if (direction.x === 0 && direction.y === 0) return;

      const head = { ...snake[0] };
      head.x += direction.x;
      head.y += direction.y;

      if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
        endGame();
        return;
      }

      if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
        endGame();
        return;
      }

      snake.unshift(head);

      if (food && head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        playEatSound();

        if (score > highScore) {
          highScore = score;
          highscoreEl.textContent = highScore;
          localStorage.setItem('snakeHighScore', highScore);
        }

        placeFood();

        clearInterval(gameLoop);
        gameLoop = setInterval(update, getCurrentSpeed());
        updateSpeedDisplay();
      } else {
        snake.pop();
      }

      draw();
    }

    function endGame() {
      gameOver = true;
      statusEl.textContent = 'Game Over \u2014 Press R to restart';
      playGameOverSound();
      clearInterval(gameLoop);
    }

    function reset() {
      snake = [{ x: 10, y: 10 }];
      direction = { x: 0, y: 0 };
      nextDirection = { x: 0, y: 0 };
      score = 0;
      scoreEl.textContent = '0';
      gameOver = false;
      started = false;
      statusEl.textContent = 'Press any arrow to start';
      placeFood();
      updateSpeedDisplay();
      draw();
      clearInterval(gameLoop);
    }

    function startLoop() {
      clearInterval(gameLoop);
      gameLoop = setInterval(update, getCurrentSpeed());
      updateSpeedDisplay();
    }

    // Skin selection
    document.querySelectorAll('.skin-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.skin-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentSkin = parseInt(btn.dataset.skin);
        draw();
      });
    });

    // Controls
    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();

      if (key === 'r' && gameOver) {
        reset();
        return;
      }

      let newDir = null;

      if (key === 'arrowup' || key === 'w') newDir = { x: 0, y: -1 };
      if (key === 'arrowdown' || key === 's') newDir = { x: 0, y: 1 };
      if (key === 'arrowleft' || key === 'a') newDir = { x: -1, y: 0 };
      if (key === 'arrowright' || key === 'd') newDir = { x: 1, y: 0 };

      if (!newDir) return;

      if (direction.x + newDir.x === 0 && direction.y + newDir.y === 0) return;

      nextDirection = newDir;

      if (!started) {
        started = true;
        statusEl.textContent = 'Playing';
        // Resume audio on first interaction
        if (audioCtx.state === 'suspended') audioCtx.resume();
        startLoop();
      }
    });

    // Init
    placeFood();
    updateSpeedDisplay();
    draw();
  </script>
</body>
</html>
