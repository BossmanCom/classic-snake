<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Classic Snake</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: none;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
      color: #94a3b8;
    }

    #game-container {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 0 2px #1e293b, 0 20px 40px rgba(0,0,0,0.4);
    }

    canvas {
      display: block;
      background: #020617;
    }

    #ui {
      margin-top: 16px;
      display: flex;
      gap: 24px;
      font-size: 1rem;
      color: #94a3b8;
    }

    #score {
      font-variant-numeric: tabular-nums;
    }

    #status {
      min-width: 120px;
      text-align: center;
    }

    .hint {
      margin-top: 18px;
      font-size: 0.85rem;
      color: #475569;
    }
  </style>
</head>
<body>
  <h1>Classic Snake</h1>

  <div id="game-container">
    <canvas id="game" width="400" height="400"></canvas>
  </div>

  <div id="ui">
    <div>Score: <span id="score">0</span></div>
    <div id="status">Press any arrow to start</div>
  </div>

  <div class="hint">Arrow keys or WASD to move</div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const statusEl = document.getElementById('status');

    // Game settings
    const GRID = 20;          // 20x20 grid
    const CELL = canvas.width / GRID;

    let snake = [{ x: 10, y: 10 }];
    let direction = { x: 0, y: 0 };
    let nextDirection = { x: 0, y: 0 };
    let food = null;
    let score = 0;
    let gameLoop = null;
    let gameOver = false;
    let started = false;

    function placeFood() {
      while (true) {
        const x = Math.floor(Math.random() * GRID);
        const y = Math.floor(Math.random() * GRID);
        const onSnake = snake.some(seg => seg.x === x && seg.y === y);
        if (!onSnake) {
          food = { x, y };
          break;
        }
      }
    }

    function draw() {
      // Clear
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Subtle grid
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1;
      for (let i = 0; i <= GRID; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL, 0);
        ctx.lineTo(i * CELL, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * CELL);
        ctx.lineTo(canvas.width, i * CELL);
        ctx.stroke();
      }

      // Food
      if (food) {
        ctx.fillStyle = '#f43f5e';
        ctx.beginPath();
        ctx.roundRect(food.x * CELL + 2, food.y * CELL + 2, CELL - 4, CELL - 4, 4);
        ctx.fill();
      }

      // Snake
      snake.forEach((seg, i) => {
        const isHead = i === 0;
        ctx.fillStyle = isHead ? '#4ade80' : '#22c55e';
        ctx.beginPath();
        ctx.roundRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2, 4);
        ctx.fill();
      });
    }

    function update() {
      if (gameOver || !started) return;

      // Apply next direction (prevents instant reverse)
      direction = { ...nextDirection };

      if (direction.x === 0 && direction.y === 0) return;

      const head = { ...snake[0] };
      head.x += direction.x;
      head.y += direction.y;

      // Wall collision
      if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
        endGame();
        return;
      }

      // Self collision
      if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
        endGame();
        return;
      }

      snake.unshift(head);

      // Eat food
      if (food && head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function endGame() {
      gameOver = true;
      statusEl.textContent = 'Game Over — Press R to restart';
      clearInterval(gameLoop);
    }

    function reset() {
      snake = [{ x: 10, y: 10 }];
      direction = { x: 0, y: 0 };
      nextDirection = { x: 0, y: 0 };
      score = 0;
      scoreEl.textContent = '0';
      gameOver = false;
      started = false;
      statusEl.textContent = 'Press any arrow to start';
      placeFood();
      draw();
      clearInterval(gameLoop);
    }

    function startLoop() {
      clearInterval(gameLoop);
      gameLoop = setInterval(update, 100); // 10 fps feel — classic speed
    }

    // Controls
    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();

      if (key === 'r' && gameOver) {
        reset();
        return;
      }

      let newDir = null;

      if (key === 'arrowup' || key === 'w') newDir = { x: 0, y: -1 };
      if (key === 'arrowdown' || key === 's') newDir = { x: 0, y: 1 };
      if (key === 'arrowleft' || key === 'a') newDir = { x: -1, y: 0 };
      if (key === 'arrowright' || key === 'd') newDir = { x: 1, y: 0 };

      if (!newDir) return;

      // Prevent reversing into yourself
      if (direction.x + newDir.x === 0 && direction.y + newDir.y === 0) return;

      nextDirection = newDir;

      if (!started) {
        started = true;
        statusEl.textContent = 'Playing';
        startLoop();
      }
    });

    // Init
    placeFood();
    draw();
  </script>
</body>
</html>
