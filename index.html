<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Classic Snake</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    h1 {
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
      color: #94a3b8;
    }

    #game-container {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 0 2px #1e293b, 0 16px 32px rgba(0,0,0,0.45);
      touch-action: none;
    }

    canvas {
      display: block;
      background: #020617;
      touch-action: none;
    }

    #ui {
      margin-top: 12px;
      display: flex;
      gap: 14px;
      font-size: 0.9rem;
      color: #94a3b8;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    #score, #highscore, #speed {
      font-variant-numeric: tabular-nums;
    }

    #status {
      min-width: 120px;
      text-align: center;
      font-size: 0.85rem;
    }

    .btn {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active {
      background: #334155;
    }

    .skins {
      margin-top: 14px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .skins span {
      font-size: 0.8rem;
      color: #64748b;
      margin-right: 2px;
    }

    .skin-btn {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      border: 2px solid transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .skin-btn.active {
      border-color: #e2e8f0;
    }

    .hint {
      margin-top: 12px;
      font-size: 0.8rem;
      color: #475569;
      text-align: center;
      max-width: 300px;
      line-height: 1.35;
      padding: 0 12px;
    }
  </style>
</head>
<body>
  <h1>Classic Snake</h1>

  <div id="game-container">
    <canvas id="game" width="360" height="360"></canvas>
  </div>

  <div id="ui">
    <div>Score: <span id="score">0</span></div>
    <div>Best: <span id="highscore">0</span></div>
    <div>Speed: <span id="speed">1.0x</span></div>
    <div id="status">Swipe to start</div>
  </div>

  <div style="margin-top: 10px; display: flex; gap: 10px;">
    <button class="btn" id="pauseBtn">Pause</button>
    <button class="btn" id="resetBtn">Reset</button>
  </div>

  <div class="skins">
    <span>Skin:</span>
    <button class="skin-btn active" data-skin="0" style="background: linear-gradient(135deg, #4ade80, #16a34a)"></button>
    <button class="skin-btn" data-skin="1" style="background: linear-gradient(135deg, #38bdf8, #0284c7)"></button>
    <button class="skin-btn" data-skin="2" style="background: linear-gradient(135deg, #c084fc, #7c3aed)"></button>
    <button class="skin-btn" data-skin="3" style="background: linear-gradient(135deg, #fb923c, #ea580c)"></button>
    <button class="skin-btn" data-skin="4" style="background: linear-gradient(135deg, #f472b6, #db2777)"></button>
  </div>

  <div class="hint">Swipe on the game to move</div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highscoreEl = document.getElementById('highscore');
    const speedEl = document.getElementById('speed');
    const statusEl = document.getElementById('status');
    const pauseBtn = document.getElementById('pauseBtn');
    const resetBtn = document.getElementById('resetBtn');

    // Audio
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playBeep(frequency, duration, type = 'square', volume = 0.12) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = frequency;
      gain.gain.setValueAtTime(volume, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playEatSound() {
      playBeep(660, 0.07, 'square', 0.1);
      setTimeout(() => playBeep(880, 0.06, 'square', 0.08), 50);
    }

    function playGameOverSound() {
      playBeep(220, 0.15, 'sawtooth', 0.1);
      setTimeout(() => playBeep(160, 0.25, 'sawtooth', 0.08), 120);
    }

    // Particles
    let particles = [];

    function spawnParticles(x, y) {
      for (let i = 0; i < 9; i++) {
        particles.push({
          x: x * CELL + CELL / 2,
          y: y * CELL + CELL / 2,
          vx: (Math.random() - 0.5) * 4.2,
          vy: (Math.random() - 0.5) * 4.2,
          life: 1,
          size: Math.random() * 2.8 + 1.4
        });
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.04;
        p.vy += 0.07;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function drawParticles() {
      particles.forEach(p => {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = '#f43f5e';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    // Game
    const GRID = 18;
    const CELL = canvas.width / GRID;

    const BASE_SPEED = 145;
    const MIN_SPEED = 70;
    const SPEED_STEP = 3.2;

    const skins = [
      ['#4ade80', '#22c55e'],
      ['#38bdf8', '#0ea5e9'],
      ['#c084fc', '#a855f7'],
      ['#fb923c', '#f97316'],
      ['#f472b6', '#ec4899']
    ];

    let currentSkin = 0;
    let snake = [{ x: 9, y: 9 }];
    let direction = { x: 0, y: 0 };
    let nextDirection = { x: 0, y: 0 };
    let food = null;
    let score = 0;
    let highScore = parseInt(localStorage.getItem('snakeHighScore') || '0');
    let gameLoop = null;
    let gameOver = false;
    let started = false;
    let paused = false;

    highscoreEl.textContent = highScore;

    function getCurrentSpeed() {
      return Math.max(MIN_SPEED, BASE_SPEED - (snake.length - 1) * SPEED_STEP);
    }

    function updateSpeedDisplay() {
      speedEl.textContent = (BASE_SPEED / getCurrentSpeed()).toFixed(1) + 'x';
    }

    function placeFood() {
      while (true) {
        const x = Math.floor(Math.random() * GRID);
        const y = Math.floor(Math.random() * GRID);
        if (!snake.some(s => s.x === x && s.y === y)) {
          food = { x, y };
          break;
        }
      }
    }

    function draw() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1;
      for (let i = 0; i <= GRID; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL, 0);
        ctx.lineTo(i * CELL, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * CELL);
        ctx.lineTo(canvas.width, i * CELL);
        ctx.stroke();
      }

      // Food
      if (food) {
        ctx.fillStyle = '#f43f5e';
        ctx.beginPath();
        ctx.roundRect(food.x * CELL + 2, food.y * CELL + 2, CELL - 4, CELL - 4, 4);
        ctx.fill();
      }

      const [headColor, bodyColor] = skins[currentSkin];

      // Body
      for (let i = snake.length - 1; i >= 1; i--) {
        const s = snake[i];
        ctx.fillStyle = bodyColor;
        ctx.beginPath();
        ctx.roundRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2, 5);
        ctx.fill();
      }

      // Head
      if (snake.length > 0) {
        const h = snake[0];
        const hx = h.x * CELL;
        const hy = h.y * CELL;

        ctx.fillStyle = headColor;
        ctx.beginPath();
        ctx.roundRect(hx + 1, hy + 1, CELL - 2, CELL - 2, 6);
        ctx.fill();

        // Eyes
        ctx.fillStyle = '#0f172a';
        const es = 2.8;
        const off = 5;

        let e1, e2;
        if (direction.x === -1) {
          e1 = { x: hx + off, y: hy + off };
          e2 = { x: hx + off, y: hy + CELL - off - es };
        } else if (direction.y === -1) {
          e1 = { x: hx + off, y: hy + off };
          e2 = { x: hx + CELL - off - es, y: hy + off };
        } else if (direction.y === 1) {
          e1 = { x: hx + off, y: hy + CELL - off - es };
          e2 = { x: hx + CELL - off - es, y: hy + CELL - off - es };
        } else {
          e1 = { x: hx + CELL - off - 1, y: hy + off };
          e2 = { x: hx + CELL - off - 1, y: hy + CELL - off - es };
        }

        ctx.beginPath();
        ctx.arc(e1.x + es/2, e1.y + es/2, es/2, 0, Math.PI * 2);
        ctx.arc(e2.x + es/2, e2.y + es/2, es/2, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(e1.x + es/2 + 0.5, e1.y + es/2 - 0.4, 0.8, 0, Math.PI * 2);
        ctx.arc(e2.x + es/2 + 0.5, e2.y + es/2 - 0.4, 0.8, 0, Math.PI * 2);
        ctx.fill();
      }

      drawParticles();
    }

    function update() {
      if (gameOver || !started || paused) return;

      direction = { ...nextDirection };
      if (direction.x === 0 && direction.y === 0) return;

      const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

      if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
        endGame();
        return;
      }

      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        endGame();
        return;
      }

      snake.unshift(head);

      if (food && head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        playEatSound();
        spawnParticles(food.x, food.y);

        if (score > highScore) {
          highScore = score;
          highscoreEl.textContent = highScore;
          localStorage.setItem('snakeHighScore', highScore);
        }

        placeFood();
        clearInterval(gameLoop);
        gameLoop = setInterval(update, getCurrentSpeed());
        updateSpeedDisplay();
      } else {
        snake.pop();
      }

      updateParticles();
      draw();
    }

    function endGame() {
      gameOver = true;
      statusEl.textContent = 'Game Over';
      playGameOverSound();
      clearInterval(gameLoop);
    }

    function reset() {
      snake = [{ x: 9, y: 9 }];
      direction = { x: 0, y: 0 };
      nextDirection = { x: 0, y: 0 };
      score = 0;
      scoreEl.textContent = '0';
      gameOver = false;
      started = false;
      paused = false;
      particles = [];
      pauseBtn.textContent = 'Pause';
      statusEl.textContent = 'Swipe to start';
      placeFood();
      updateSpeedDisplay();
      draw();
      clearInterval(gameLoop);
    }

    function startLoop() {
      clearInterval(gameLoop);
      gameLoop = setInterval(update, getCurrentSpeed());
      updateSpeedDisplay();
    }

    function togglePause() {
      if (!started || gameOver) return;
      paused = !paused;
      if (paused) {
        statusEl.textContent = 'Paused';
        pauseBtn.textContent = 'Resume';
        clearInterval(gameLoop);
      } else {
        statusEl.textContent = 'Playing';
        pauseBtn.textContent = 'Pause';
        startLoop();
      }
    }

    function setDirection(newDir) {
      // Prevent reverse
      if (direction.x + newDir.x === 0 && direction.y + newDir.y === 0) return;

      nextDirection = newDir;

      if (!started) {
        started = true;
        statusEl.textContent = 'Playing';
        if (audioCtx.state === 'suspended') audioCtx.resume();
        startLoop();
      }
    }

    // Buttons
    pauseBtn.addEventListener('click', togglePause);
    resetBtn.addEventListener('click', reset);

    // Skins
    document.querySelectorAll('.skin-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.skin-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentSkin = parseInt(btn.dataset.skin);
        draw();
      });
    });

    // Keyboard (desktop)
    window.addEventListener('keydown', e => {
      const key = e.key.toLowerCase();
      if (key === 'r') { reset(); return; }
      if (key === 'p' || key === ' ') { e.preventDefault(); togglePause(); return; }

      let dir = null;
      if (key === 'arrowup' || key === 'w') dir = { x: 0, y: -1 };
      if (key === 'arrowdown' || key === 's') dir = { x: 0, y: 1 };
      if (key === 'arrowleft' || key === 'a') dir = { x: -1, y: 0 };
      if (key === 'arrowright' || key === 'd') dir = { x: 1, y: 0 };
      if (dir) setDirection(dir);
    });

    // ========== IMPROVED MOBILE SWIPE ==========
    let startX = 0;
    let startY = 0;
    let moved = false;

    function onTouchStart(e) {
      e.preventDefault();
      const t = e.touches[0];
      startX = t.clientX;
      startY = t.clientY;
      moved = false;
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function onTouchMove(e) {
      e.preventDefault();
      if (moved || gameOver || paused) return;

      const t = e.touches[0];
      const dx = t.clientX - startX;
      const dy = t.clientY - startY;

      // Require a decent swipe distance before registering
      if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;

      moved = true; // only register one direction per swipe

      if (Math.abs(dx) > Math.abs(dy)) {
        setDirection(dx > 0 ? { x: 1, y: 0 } : { x: -1, y: 0 });
      } else {
        setDirection(dy > 0 ? { x: 0, y: 1 } : { x: 0, y: -1 });
      }
    }

    function onTouchEnd(e) {
      e.preventDefault();
      moved = false;
    }

    canvas.addEventListener('touchstart', onTouchStart, { passive: false });
    canvas.addEventListener('touchmove', onTouchMove, { passive: false });
    canvas.addEventListener('touchend', onTouchEnd, { passive: false });

    // Also allow swiping on the container
    document.getElementById('game-container').addEventListener('touchstart', onTouchStart, { passive: false });
    document.getElementById('game-container').addEventListener('touchmove', onTouchMove, { passive: false });
    document.getElementById('game-container').addEventListener('touchend', onTouchEnd, { passive: false });

    // Init
    placeFood();
    updateSpeedDisplay();
    draw();
  </script>
</body>
</html>
